# Next/previous are matched before play_song (equal scores keep the earlier
# sentence). The DSL cannot exclude a capture, so "play song next" can still
# hit play_song; LocalMusicPhrases redirects that capture and the exact
# utterances below. A title that only contains the word ("play song next to
# me", "play song last christmas") stays play_song.
#
# "play next from my music" / "play last from my phone" is the second
# play_song line: it searches for a song named next/last. It is not a skip.
#
# Stop-music phrases live on MediaSkill (en/media.yml), including "turn off
# the music" and "turn the music off". That skill has no storage permission.
# Repeat stays here and is still permission-gated.
next:
  - play the? next|following (song|track|music|media|audio|one)?

previous:
  - play the? previous|last (song|track|music|media|audio)?

play_song:
  - play the? song|track|music .song.
  - play .song. from my music|phone

repeat_one:
  - repeat this (song|track|one)?
  - repeat the song|track
  - repeat one
  - loop this song

repeat_all:
  - repeat all|everything|(the playlist)
  - loop all

repeat_off:
  - (stop|(turn off)|disable) (repeat|repeating|looping)
  - repeat off
