syntax = "proto3";

option java_package = "org.stypox.dicio.skills.local_music";
option java_multiple_files = true;

message SkillSettingsLocalMusic {
  // SAF tree URI from OpenDocumentTree, persisted with takePersistableUriPermission.
  // Empty means the public Music/ folder via MediaStore.
  string music_folder_tree_uri = 1;
}
